name: Website enquiry checks

on:
  pull_request:
    paths:
      - 'energydune-enquiries/**'
      - '.github/workflows/enquiries-check.yml'
  push:
    branches: [main]
    paths:
      - 'energydune-enquiries/**'
      - '.github/workflows/enquiries-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energydune-enquiries
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: energydune-enquiries/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
